[profile.default]
src = "contracts"
test = "test"
out = "out"
libs = ["lib"]
remappings = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]

solc = "0.8.28"
# Creditcoin3 runs `fp_evm::Config::cancun()` (runtime/src/lib.rs:461), so Cancun
# opcodes are safe on the deployment target as well as on Sepolia.
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# The verifier builds an eight-field struct from decoded log data inside a loop,
# which exhausts the legacy code generator's stack. The IR pipeline handles it and
# optimises better; the cost is slower compilation, which this project can afford.
via_ir = true

bytecode_hash = "none"
cbor_metadata = false

# Test fixtures are captured from the live network by scripts/capture-fixtures.ts.
fs_permissions = [{ access = "read", path = "./test/fixtures" }]

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false
int_types = "long"
